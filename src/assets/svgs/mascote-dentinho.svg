<svg viewBox="0 0 240 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="capeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#98ca3c"/>
      <stop offset="100%" stop-color="#1a8f68"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf1d6"/>
    </linearGradient>
    <radialGradient id="cheekGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f78f24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f78f24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sombra de contato -->
  <ellipse cx="120" cy="278" rx="52" ry="10" fill="#00543d" opacity="0.12"/>

  <!-- capa -->
  <path d="M92,84 C44,94 4,128 7,188 C9,228 14,254 29,247 C33,261 45,257 49,237 L80,160 Z" fill="url(#capeGrad)"/>
  <path d="M148,84 C196,94 236,128 233,188 C231,228 226,254 211,247 C207,261 195,257 191,237 L160,160 Z" fill="url(#capeGrad)"/>

  <!-- bracos / luvas (maos na cintura) -->
  <path d="M80,170 C58,178 46,198 52,213 C57,224 71,223 75,211 C79,199 81,182 80,170 Z" fill="#00754f" stroke="#00543d" stroke-width="1.5"/>
  <ellipse cx="58" cy="210" rx="15" ry="13" fill="#00543d"/>
  <path d="M160,170 C182,178 194,198 188,213 C183,224 169,223 165,211 C161,199 159,182 160,170 Z" fill="#00754f" stroke="#00543d" stroke-width="1.5"/>
  <ellipse cx="182" cy="210" rx="15" ry="13" fill="#00543d"/>

  <!-- pernas / botas -->
  <rect x="96" y="222" width="18" height="42" rx="8" fill="#fdf1d6"/>
  <rect x="126" y="222" width="18" height="42" rx="8" fill="#fdf1d6"/>
  <rect x="82" y="256" width="34" height="18" rx="9" fill="#00543d"/>
  <rect x="124" y="256" width="34" height="18" rx="9" fill="#00543d"/>

  <!-- corpo (dente) -->
  <path d="M120,18
           C88,18 64,42 64,76
           C64,104 74,118 74,146
           C74,168 84,190 100,186
           C110,183 110,168 120,168
           C130,168 130,183 140,186
           C156,190 166,168 166,146
           C166,118 176,104 176,76
           C176,42 152,18 120,18 Z"
        fill="url(#bodyGrad)" stroke="#eadcb8" stroke-width="1.5"/>

  <!-- bochechas -->
  <circle cx="88" cy="112" r="16" fill="url(#cheekGrad)"/>
  <circle cx="152" cy="112" r="16" fill="url(#cheekGrad)"/>

  <!-- sobrancelhas -->
  <path d="M80,80 C87,72 98,72 104,78" fill="none" stroke="#7a4a24" stroke-width="4" stroke-linecap="round"/>
  <path d="M136,78 C142,72 153,72 160,80" fill="none" stroke="#7a4a24" stroke-width="4" stroke-linecap="round"/>

  <!-- olhos -->
  <circle cx="93" cy="98" r="10" fill="#3a2415"/>
  <circle cx="96.5" cy="94.5" r="3" fill="#fff"/>
  <circle cx="147" cy="98" r="10" fill="#3a2415"/>
  <circle cx="150.5" cy="94.5" r="3" fill="#fff"/>

  <!-- sorriso -->
  <path d="M92,122 C102,142 138,142 148,122" fill="none" stroke="#3a2415" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M102,132 C110,140 130,140 138,132 L136,136 C128,142 112,142 104,136 Z" fill="#fff"/>

  <!-- laco/cravat verde no pescoco -->
  <path d="M95,150 L120,166 L145,150 L138,180 C128,190 112,190 102,180 Z" fill="#1a8f68" stroke="#00543d" stroke-width="1.5"/>
  <circle cx="120" cy="163" r="7" fill="#00543d"/>

  <!-- cinto -->
  <rect x="76" y="196" width="88" height="14" rx="7" fill="#00543d"/>
  <rect x="108" y="192" width="24" height="22" rx="5" fill="#e5bf6d" stroke="#a97f2f" stroke-width="1.5"/>
</svg>
