<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./public/TDB_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Poppins:wght@100..900&display=swap" rel="stylesheet">
    <title>Raiz do Bem</title>
    <style>
      /* VLibras — posicionado bottom-left para não sobrepor ações principais.
         z-index 900: acima do conteúdo normal, abaixo de modais (z-999). */
      div[vw] {
        position: fixed !important;
        bottom: 5.5rem !important;
        left: 1rem !important;
        right: auto !important;
        z-index: 900 !important;
      }
      div[vw] .vw-plugin-wrapper {
        z-index: 900 !important;
      }
      /* Em desktop (sem bottomnav mobile), recua para bottom normal */
      @media (min-width: 1024px) {
        div[vw] {
          bottom: 1.5rem !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- VLibras — plugin oficial do Governo Federal para tradução em LIBRAS -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
  </body>
</html>
